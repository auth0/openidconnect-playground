name: Run Tests

on:
  pull_request:
    branches:
      - ui-redesign
      - master
  push:
    branches:
      - ui-redesign
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run
